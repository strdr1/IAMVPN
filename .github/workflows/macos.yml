name: macOS DMG

# Builds a universal (Apple Silicon + Intel) IAMVPN.app and packs it into
# IAMVPN-mac.dmg. On a published release the DMG is attached to it;
# a manual run only uploads it as a workflow artifact.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.12.12"
  PYTHON_PKG: "https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg"

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from main.cpp
        run: |
          VER=$(grep -o 'setApplicationVersion(QStringLiteral("[0-9.]*")' src/main.cpp | grep -o '[0-9][0-9.]*')
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Building IAMVPN $VER"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Drop AGL from Qt's OpenGL wrapper
        # Qt 6.8.1 still links the AGL framework, which recent macOS SDKs no
        # longer ship ("ld: framework 'AGL' not found").
        run: |
          F="$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"
          sed -i '' -e 's/"-framework AGL"/""/' "$F"
          sed -i '' -e 's/find_library(WrapOpenGL_AGL NAMES AGL)/set(WrapOpenGL_AGL "")/' "$F"
          grep -n "AGL" "$F" || true
          echo "--- other AGL references in Qt:"
          grep -rIl "AGL" "$QT_ROOT_DIR/lib/cmake" "$QT_ROOT_DIR/mkspecs" 2>/dev/null | head -20 || true

      - name: sing-box (universal)
        run: |
          mkdir -p engine-mac/vpn sb
          for a in amd64 arm64; do
            curl -fsSL -o sb/$a.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-$a.tar.gz"
            tar -xzf sb/$a.tgz -C sb
          done
          lipo -create sb/sing-box-${SING_BOX_VERSION}-darwin-amd64/sing-box sb/sing-box-${SING_BOX_VERSION}-darwin-arm64/sing-box -output engine-mac/vpn/sing-box
          chmod +x engine-mac/vpn/sing-box
          codesign --force -s - engine-mac/vpn/sing-box
          lipo -info engine-mac/vpn/sing-box
          engine-mac/vpn/sing-box version

      - name: Telegram proxy (PyInstaller, universal2)
        continue-on-error: true
        run: |
          curl -fsSL -o py.pkg "$PYTHON_PKG"
          sudo installer -pkg py.pkg -target / >/dev/null
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          "$PY" -m pip install --quiet pyinstaller "httpx[http2]==0.28.1" certifi
          mkdir -p engine-mac/tgproxy
          cd engine/tgproxy
          "$PY" -m PyInstaller --onefile --noconfirm --target-arch universal2 \
            --name tg-ws-proxy --paths . --collect-data certifi \
            --distpath ../../engine-mac/tgproxy --workpath ../../tgbuild --specpath ../../tgbuild \
            ../../installer/macos/tgmain.py
          cd ../..
          codesign --force -s - engine-mac/tgproxy/tg-ws-proxy
          lipo -info engine-mac/tgproxy/tg-ws-proxy
          # Must actually start: a broken binary is removed rather than shipped.
          # --help exits before the proxy loads its crypto, so run it briefly.
          engine-mac/tgproxy/tg-ws-proxy --port 1499 --host 127.0.0.1 > tg-smoke.log 2>&1 &
          TPID=$!
          sleep 6
          if kill -0 $TPID 2>/dev/null; then
            kill $TPID; cat tg-smoke.log | head -20
          else
            cat tg-smoke.log; rm -f engine-mac/tgproxy/tg-ws-proxy
            echo "::warning::tg-ws-proxy exited early, shipping without Telegram proxy"; exit 1
          fi

      - name: Build app
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DIAMVPN_VERSION="$VER"
          if ! cmake --build build --parallel; then
            echo "--- files mentioning AGL:"
            grep -rl "AGL" build/CMakeFiles | head || true
            echo "--- link line:"
            cat build/CMakeFiles/IAMVPN.dir/link.txt || true
            exit 1
          fi
          lipo -info build/IAMVPN.app/Contents/MacOS/IAMVPN

      - name: Deploy Qt and sign
        run: |
          macdeployqt build/IAMVPN.app -qmldir=qml -always-overwrite
          # SQL drivers come in as a dependency of a QML module; only SQLite
          # can load (the rest need client libraries that aren't there).
          find build/IAMVPN.app/Contents/PlugIns/sqldrivers -type f ! -name 'libqsqlite*' -delete 2>/dev/null || true
          codesign --force --deep -s - build/IAMVPN.app
          codesign --verify --deep --strict build/IAMVPN.app
          ls -la build/IAMVPN.app/Contents/Resources build/IAMVPN.app/Contents/Resources/engine/*

      - name: Smoke test (QML loads, no missing modules)
        run: |
          QT_QPA_PLATFORM=offscreen build/IAMVPN.app/Contents/MacOS/IAMVPN > smoke.log 2>&1 &
          PID=$!
          sleep 12
          kill $PID 2>/dev/null || true
          cat smoke.log
          if grep -E "is not installed|module .* not found|qrc:.*(Error|error)|Cannot load library|Failed to create" smoke.log; then
            echo "::error::QML/plugin problems in smoke test"; exit 1
          fi

      - name: Make DMG
        run: |
          mkdir -p dmg
          cp -R build/IAMVPN.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "IAMVPN" -srcfolder dmg -ov -format UDZO IAMVPN-mac.dmg
          ls -la IAMVPN-mac.dmg
          shasum -a 256 IAMVPN-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: IAMVPN-mac
          path: IAMVPN-mac.dmg

      - name: Launch test like a user (real Cocoa, from the DMG)
        # The offscreen smoke test above never touches Cocoa or LaunchServices.
        # Here the app is installed from the DMG and started via `open`, the
        # way Finder does. If it dies early, the job fails and the release
        # does not get the DMG.
        run: |
          set +e
          hdiutil attach IAMVPN-mac.dmg -nobrowse -mountpoint /tmp/iamdmg
          ls -l /tmp/iamdmg/IAMVPN.app/Contents/MacOS
          cp -R /tmp/iamdmg/IAMVPN.app /Applications/
          hdiutil detach /tmp/iamdmg
          APP=/Applications/IAMVPN.app
          echo "=== codesign"; codesign -dv "$APP" 2>&1 | head -12
          codesign --verify --deep --strict --verbose=2 "$APP"; echo "verify rc=$?"
          echo "=== spctl (ad-hoc is expected to be rejected)"; spctl -a -vv -t exec "$APP"
          echo "=== libraries outside the bundle/system"
          for f in "$APP/Contents/MacOS/IAMVPN" $(find "$APP/Contents" -name '*.dylib') $(find "$APP/Contents/Frameworks" -type f -perm +111); do
            otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(@rpath|@executable_path|@loader_path|/usr/lib/|/System/)' | sed "s|^|$f -> |"
          done | sort -u | head -40
          FAIL=0

          echo "=== 1) direct start, real Cocoa"
          "$APP/Contents/MacOS/IAMVPN" > direct.log 2>&1 &
          P=$!; sleep 12
          if kill -0 $P 2>/dev/null; then echo "DIRECT: running"; kill $P; else echo "DIRECT: DIED"; FAIL=1; fi
          sleep 2; cat direct.log

          echo "=== 2) open via LaunchServices (as Finder)"
          open "$APP" --stdout "$PWD/open.out" --stderr "$PWD/open.err"; echo "open rc=$?"
          sleep 12
          if pgrep -x IAMVPN >/dev/null; then echo "OPEN: running"; else echo "OPEN: DIED"; FAIL=1; fi
          pkill -x IAMVPN; sleep 2; cat open.out open.err

          echo "=== 3) quarantined like a Telegram download (informational)"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Telegram;" "$APP"
          open "$APP"; echo "open rc=$?"; sleep 10
          if pgrep -x IAMVPN >/dev/null; then echo "QUARANTINED: running"; else echo "QUARANTINED: not running (Gatekeeper)"; fi
          pkill -x IAMVPN

          echo "=== crash reports"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i iamvpn | head
          R=$(ls -t ~/Library/Logs/DiagnosticReports/*IAMVPN* 2>/dev/null | head -1)
          [ -n "$R" ] && head -c 6000 "$R"
          echo "=== system log"
          log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "IAMVPN" OR process == "IAMVPN"' 2>/dev/null | grep -viE "mdworker|spotlight" | tail -60
          exit $FAIL

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" IAMVPN-mac.dmg --clobber
